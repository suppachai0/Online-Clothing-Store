{% load static %}
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรไฟล์ของฉัน</title>
    <link rel="stylesheet" type="text/css" href="{% static 'css/styles.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'dashboard' %}">🏠 Dashboard</a>
            <span class="navbar-text text-white">โปรไฟล์ของ {{ user.username }}</span>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="card">
            <div class="card-body">
                <h2 class="text-center">โปรไฟล์ของฉัน</h2>
                <ul class="list-group">
                    <li class="list-group-item"><strong>👤 ชื่อผู้ใช้:</strong> {{ user.username }}</li>
                    <li class="list-group-item"><strong>📧 อีเมล:</strong> {{ user.email }}</li>
                </ul>
                <div class="text-center mt-3">
                    <a href="{% url 'dashboard' %}" class="btn btn-secondary">กลับไปหน้าหลัก</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
