{% load static %}
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" type="text/css" href="{% static 'css/styles.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">🏠 Dashboard</a>
            <span class="navbar-text text-white">ยินดีต้อนรับ, {{ user.username }}</span>
            <a href="{% url 'logout' %}" class="btn btn-danger">ออกจากระบบ</a>
        </div>
    </nav>

    <div class="container mt-4">
        <h2 class="text-center">ยินดีต้อนรับ, {{ user.username }}!</h2>
        <div class="row mt-4">
            <div class="col-md-4">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title">🛒 ดูสินค้า</h5>
                        <a href="{% url 'product_list' %}" class="btn btn-primary">ไปยังร้านค้า</a>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title">👤 โปรไฟล์</h5>
                        <a href="{% url 'profile' %}" class="btn btn-info">ดูข้อมูล</a>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title">🚪 ออกจากระบบ</h5>
                        <a href="{% url 'logout' %}" class="btn btn-danger">ออกจากระบบ</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
