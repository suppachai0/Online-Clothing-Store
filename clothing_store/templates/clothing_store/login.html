{% load static %}
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ</title>

    <!-- โหลด Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- โหลด CSS -->
    <link rel="stylesheet" type="text/css" href="{% static 'css/signin.css' %}">

</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow-lg">
                    <div class="card-body">
                        <h3 class="text-center">เข้าสู่ระบบ</h3>
                        {% if messages %}
                            <div class="alert alert-danger">
                                {% for message in messages %}
                                    <p>{{ message }}</p>
                                {% endfor %}
                            </div>
                        {% endif %}

                        <form method="POST">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="username" class="form-label">ชื่อผู้ใช้</label>
                                <input type="text" name="username" class="form-control" placeholder="กรอกชื่อผู้ใช้">
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">รหัสผ่าน</label>
                                <input type="password" name="password" class="form-control" placeholder="กรอกรหัสผ่าน">
                            </div>
                            <button class="btn btn-primary w-100" type="submit">เข้าสู่ระบบ</button>
                        </form>
                    </div>
                </div>
                <p>ยังไม่มีบัญชี? <a href="{% url 'signup' %}">สมัครสมาชิก</a></p>
            </div>
        </div>
    </div>

</body>
</html>
